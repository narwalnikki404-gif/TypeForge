<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TypeForge — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Sora:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#06060b;--bg2:#0c0c16;--bg3:rgba(14,14,26,0.75);--bg4:#101020;
--bdr:rgba(255,255,255,0.06);--bdr2:rgba(255,255,255,0.1);--bdr3:rgba(255,255,255,0.15);
--t1:#f0f0f8;--t2:#8888a0;--t3:#55556a;--t4:#33334a;
--ac:#6366f1;--ac2:#818cf8;--ac3:rgba(99,102,241,0.12);--ac4:rgba(99,102,241,0.25);
--gn:#10b981;--gn2:rgba(16,185,129,0.12);--gn3:rgba(16,185,129,0.3);
--rd:#ef4444;--rd2:rgba(239,68,68,0.1);--rd3:rgba(239,68,68,0.3);
--am:#f59e0b;--am2:rgba(245,158,11,0.12);
--r:14px;--r2:18px;--r3:24px;
--f1:'Outfit',sans-serif;--f2:'JetBrains Mono',monospace;--f3:'Sora',sans-serif;
--shadow:0 8px 32px rgba(0,0,0,0.35);
}
html{scroll-behavior:smooth}
body{font-family:var(--f1);background:var(--bg);color:var(--t1);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:99px}

/* BG */
.orb{position:fixed;border-radius:50%;filter:blur(130px);pointer-events:none;z-index:0}
.o1{width:700px;height:700px;background:#6366f1;top:-250px;left:-150px;opacity:.08}
.o2{width:550px;height:550px;background:#8b5cf6;bottom:-250px;right:-150px;opacity:.07}

/* HEADER */
.hdr{position:sticky;top:0;z-index:200;background:rgba(6,6,11,.65);backdrop-filter:blur(40px);border-bottom:1px solid var(--bdr)}
.hdr-in{max-width:1280px;margin:0 auto;padding:0 28px;height:64px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--t1)}
.logo-m{width:38px;height:38px;background:linear-gradient(135deg,var(--ac),#8b5cf6);border-radius:11px;display:grid;place-items:center;font-size:15px;color:#fff}
.logo-t{font-family:var(--f3);font-size:20px;font-weight:800;letter-spacing:-.03em}
.logo-t span{background:linear-gradient(135deg,var(--ac2),#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr-r{display:flex;align-items:center;gap:10px}
.ib{width:40px;height:40px;border-radius:11px;border:1px solid var(--bdr);background:rgba(255,255,255,.02);color:var(--t2);display:grid;place-items:center;cursor:pointer;font-size:14px;text-decoration:none;transition:all .25s}
.ib:hover{border-color:var(--bdr2);color:var(--t1);background:rgba(255,255,255,.04)}

/* LAYOUT */
.main{max-width:1280px;margin:0 auto;padding:40px 28px 80px;position:relative;z-index:1}
@media(max-width:600px){.main{padding:20px 16px 60px}}

/* LOADING */
.loading{display:flex;align-items:center;justify-content:center;min-height:60vh;flex-direction:column;gap:16px;color:var(--t2);font-size:15px}
.spin{width:40px;height:40px;border:3px solid var(--bdr2);border-top-color:var(--ac);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* LOGIN GATE */
.gate{display:flex;align-items:center;justify-content:center;min-height:70vh;flex-direction:column;gap:20px;text-align:center;padding:24px}
.gate h2{font-family:var(--f3);font-size:28px;font-weight:800}
.gate p{color:var(--t2);max-width:400px;line-height:1.6}
.btn-google{display:inline-flex;align-items:center;gap:12px;padding:14px 28px;background:#fff;color:#1a1a2e;font-family:var(--f1);font-size:15px;font-weight:600;border:none;border-radius:14px;cursor:pointer;text-decoration:none;transition:all .25s}
.btn-google:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,.35)}
.btn-google i{font-size:18px;color:#4285f4}

/* PROFILE HERO */
.profile-hero{display:flex;align-items:center;gap:20px;margin-bottom:36px;padding:24px 28px;background:var(--bg3);border:1px solid var(--bdr);border-radius:var(--r3);backdrop-filter:blur(12px)}
.profile-pic{width:72px;height:72px;border-radius:50%;border:3px solid var(--ac);object-fit:cover;flex-shrink:0}
.profile-info h2{font-family:var(--f3);font-size:24px;font-weight:800}
.profile-info p{color:var(--t2);font-size:14px;margin-top:3px}
.streak-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:99px;background:var(--am2);border:1px solid rgba(245,158,11,.3);color:var(--am);font-size:12px;font-weight:700;margin-top:8px}

/* STAT GRID */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:32px}
.stat-card{background:var(--bg3);border:1px solid var(--bdr);border-radius:var(--r2);padding:20px 22px;backdrop-filter:blur(12px);transition:border-color .25s}
.stat-card:hover{border-color:var(--bdr2)}
.stat-card .lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--t3);margin-bottom:8px}
.stat-card .val{font-family:var(--f2);font-size:28px;font-weight:700}
.stat-card .val.green{color:var(--gn)}
.stat-card .val.purple{background:linear-gradient(135deg,var(--ac2),#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-card .sub{font-size:11px;color:var(--t3);margin-top:4px}

/* CHART */
.chart-card{background:var(--bg3);border:1px solid var(--bdr);border-radius:var(--r2);padding:24px;margin-bottom:24px;backdrop-filter:blur(12px)}
.chart-card h3{font-family:var(--f3);font-size:16px;font-weight:700;margin-bottom:18px}
.chart-wrap{height:200px;position:relative;overflow:hidden}
svg.sparkline{width:100%;height:100%}

/* TABLE */
.section-title{font-family:var(--f3);font-size:18px;font-weight:700;margin-bottom:16px;margin-top:32px}
.table-card{background:var(--bg3);border:1px solid var(--bdr);border-radius:var(--r2);overflow:hidden;backdrop-filter:blur(12px);margin-bottom:24px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:12px 18px;text-align:left;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--t3);border-bottom:1px solid var(--bdr)}
td{padding:12px 18px;border-bottom:1px solid rgba(255,255,255,.03);color:var(--t2)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.015)}
td .pass{color:var(--gn);font-weight:700}
td .fail{color:var(--rd);font-weight:700}
td .mono{font-family:var(--f2);color:var(--t1)}
td .date{font-size:11px;color:var(--t3)}

/* EXAM BREAKDOWN */
.exam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-bottom:32px}
.exam-card{background:var(--bg3);border:1px solid var(--bdr);border-radius:var(--r2);padding:20px;backdrop-filter:blur(12px);transition:border-color .25s}
.exam-card:hover{border-color:var(--bdr2)}
.exam-card h4{font-family:var(--f3);font-size:15px;font-weight:700;margin-bottom:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exam-stat-row{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.exam-stat-row:last-child{border-bottom:none}
.exam-stat-row .k{color:var(--t3)}.exam-stat-row .v{font-family:var(--f2);font-weight:600;color:var(--t1)}
.pass-rate{height:4px;background:var(--bdr);border-radius:99px;margin-top:12px;overflow:hidden}
.pass-rate-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gn),#34d399);transition:width .8s}

@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.afu{animation:fadeUp .5s ease forwards;opacity:0}
.d1{animation-delay:.05s}.d2{animation-delay:.1s}.d3{animation-delay:.15s}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div>

<header class="hdr"><div class="hdr-in">
  <a href="/" class="logo">
    <div class="logo-m"><i class="fa-solid fa-keyboard"></i></div>
    <div class="logo-t">Type<span>Forge</span></div>
  </a>
  <div class="hdr-r">
    <a href="/" class="ib" title="Practice"><i class="fa-solid fa-keyboard"></i></a>
    <button class="ib" onclick="fetch('/auth/logout',{method:'POST'}).then(()=>location.href='/')" title="Sign Out"><i class="fa-solid fa-right-from-bracket"></i></button>
  </div>
</div></header>

<main class="main" id="mainContent">
  <div class="loading" id="loadingState">
    <div class="spin"></div>
    <span>Loading your stats…</span>
  </div>
  <div id="gateState" style="display:none" class="gate">
    <i class="fa-solid fa-chart-line" style="font-size:48px;color:var(--ac2);margin-bottom:8px"></i>
    <h2>Sign in to see your Dashboard</h2>
    <p>Track your typing progress, WPM trends, and performance across all exam types.</p>
    <a href="/" class="btn-google" style="background:linear-gradient(135deg,var(--ac),#8b5cf6);color:#fff">
      <i class="fa-solid fa-right-to-bracket"></i> Sign In on Home Page
    </a>
  </div>
  <div id="dashContent" style="display:none"></div>
</main>

<script>
async function loadDashboard(){
  try{
    const res=await fetch('/api/dashboard');
    if(res.status===401){
      document.getElementById('loadingState').style.display='none';
      document.getElementById('gateState').style.display='flex';
      return;
    }
    const data=await res.json();
    renderDashboard(data);
  }catch(e){
    document.getElementById('loadingState').innerHTML='<i class="fa-solid fa-triangle-exclamation" style="font-size:32px;color:var(--am)"></i><span style="color:var(--t2)">Could not load dashboard. Make sure you are connected.</span>';
  }
}

function fmtDate(d){
  const dt=new Date(d);
  return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
}

function sparkline(data,key,color){
  if(!data||!data.length)return '';
  const vals=data.map(d=>+d[key]||0);
  const min=Math.min(...vals),max=Math.max(...vals);
  const rng=Math.max(max-min,1);
  const W=600,H=180,pad=8;
  const pts=vals.map((v,i)=>{
    const x=pad+(i/(vals.length-1||1))*(W-pad*2);
    const y=H-pad-((v-min)/rng)*(H-pad*2);
    return `${x},${y}`;
  });
  const area=`M${pts[0]} ${pts.slice(1).map(p=>'L'+p).join(' ')} L${W-pad},${H-pad} L${pad},${H-pad} Z`;
  const line=`M${pts[0]} ${pts.slice(1).map(p=>'L'+p).join(' ')}`;
  return `<svg class="sparkline" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="grad${key}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.3"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#grad${key})"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${vals.map((v,i)=>`<circle cx="${pts[i].split(',')[0]}" cy="${pts[i].split(',')[1]}" r="3" fill="${color}"/>`).join('')}
  </svg>`;
}

function renderDashboard(data){
  document.getElementById('loadingState').style.display='none';
  const {user,overall,byExam,recent}=data;
  const passRate=overall.total_attempts>0?Math.round((overall.passed/overall.total_attempts)*100):0;
  const totalMin=Math.round((+overall.total_time_secs||0)/60);

  const html=`
  <div class="profile-hero afu">
    <div style="width:72px;height:72px;border-radius:50%;border:3px solid var(--ac);background:linear-gradient(135deg,var(--ac),#8b5cf6);display:grid;place-items:center;font-family:var(--f3);font-size:28px;font-weight:800;color:#fff;flex-shrink:0">${(user.username||'U')[0].toUpperCase()}</div>
    <div class="profile-info">
      <h2>${user.username||'Typist'}</h2>
      <p style="color:var(--t3);font-size:12px">Member since ${new Date(user.created_at).toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</p>
      <div class="streak-badge"><i class="fa-solid fa-fire"></i> ${overall.streak} day streak</div>
    </div>
  </div>

  <div class="stat-grid afu d1">
    <div class="stat-card">
      <div class="lbl">Total Tests</div>
      <div class="val purple">${overall.total_attempts||0}</div>
      <div class="sub">${overall.passed||0} passed · ${overall.failed||0} failed</div>
    </div>
    <div class="stat-card">
      <div class="lbl">Best Net WPM</div>
      <div class="val purple">${overall.best_wpm||0}</div>
      <div class="sub">Avg: ${overall.avg_wpm||0} WPM</div>
    </div>
    <div class="stat-card">
      <div class="lbl">Avg Accuracy</div>
      <div class="val ${(overall.avg_accuracy||0)>=94?'green':'purple'}">${overall.avg_accuracy||0}%</div>
      <div class="sub">Across all attempts</div>
    </div>
    <div class="stat-card">
      <div class="lbl">Pass Rate</div>
      <div class="val ${passRate>=60?'green':'purple'}">${passRate}%</div>
      <div class="sub">${overall.passed||0} of ${overall.total_attempts||0}</div>
    </div>
    <div class="stat-card">
      <div class="lbl">Best KDPH</div>
      <div class="val purple">${(overall.best_kdph||0).toLocaleString()}</div>
      <div class="sub">Avg: ${(overall.avg_kdph||0).toLocaleString()}</div>
    </div>
    <div class="stat-card">
      <div class="lbl">Time Practiced</div>
      <div class="val purple">${totalMin}</div>
      <div class="sub">minutes total</div>
    </div>
  </div>

  ${recent&&recent.length>1?`
  <div class="chart-card afu d2">
    <h3><i class="fa-solid fa-chart-line" style="color:var(--ac2);margin-right:8px"></i>Net WPM — Last ${recent.length} Attempts</h3>
    <div class="chart-wrap">${sparkline(recent,'net_wpm','#818cf8')}</div>
  </div>
  <div class="chart-card afu d2">
    <h3><i class="fa-solid fa-bullseye" style="color:var(--gn);margin-right:8px"></i>Accuracy — Last ${recent.length} Attempts</h3>
    <div class="chart-wrap">${sparkline(recent,'accuracy','#10b981')}</div>
  </div>`:''}

  ${byExam&&byExam.length?`
  <div class="section-title afu d2"><i class="fa-solid fa-trophy" style="color:var(--am);margin-right:8px"></i>Performance by Exam</div>
  <div class="exam-grid afu d3">
    ${byExam.map(ex=>{
      const pr=ex.attempts>0?Math.round((ex.passed/ex.attempts)*100):0;
      return `<div class="exam-card">
        <h4>${ex.exam_name||ex.exam_id}</h4>
        <div class="exam-stat-row"><span class="k">Attempts</span><span class="v">${ex.attempts}</span></div>
        <div class="exam-stat-row"><span class="k">Best WPM</span><span class="v">${ex.best_wpm||'—'}</span></div>
        <div class="exam-stat-row"><span class="k">Avg WPM</span><span class="v">${ex.avg_wpm||'—'}</span></div>
        <div class="exam-stat-row"><span class="k">Avg Accuracy</span><span class="v">${ex.avg_accuracy||'—'}%</span></div>
        <div class="exam-stat-row"><span class="k">Pass Rate</span><span class="v">${pr}%</span></div>
        <div class="pass-rate"><div class="pass-rate-fill" style="width:${pr}%"></div></div>
      </div>`;
    }).join('')}
  </div>`:''}

  <div class="section-title afu d3"><i class="fa-solid fa-clock-rotate-left" style="color:var(--ac2);margin-right:8px"></i>Recent Attempts</div>
  <div class="table-card afu d3">
    <table>
      <thead><tr>
        <th>Exam</th><th>Net WPM</th><th>Accuracy</th><th>Keystrokes</th><th>Result</th><th>Date</th>
      </tr></thead>
      <tbody>
        ${[...recent].reverse().slice(0,20).map(a=>`<tr>
          <td>${a.exam_id}</td>
          <td class="mono">${a.net_wpm||'—'}</td>
          <td class="mono">${a.accuracy||'—'}%</td>
          <td class="mono">${(a.keystrokes||0).toLocaleString()}</td>
          <td>${a.passed?'<span class="pass">✓ Pass</span>':'<span class="fail">✗ Fail</span>'}</td>
          <td class="date">${fmtDate(a.created_at)}</td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`;

  document.getElementById('dashContent').innerHTML=html;
  document.getElementById('dashContent').style.display='block';
}

loadDashboard();
</script>
</body>
</html>
